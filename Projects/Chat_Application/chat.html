<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="left-header">
            <img src="images/meetme.png" alt="App logo" class="app-logo">
        </div>
        <div class="right-header">
            <button id="auth-btn">Sign-In/Sign-Up</button>
        </div>
    </header>
    <main class="chat-container">
        <div class="chat-left">
            <div class="search-bar">
                <input type="text" placeholder="Search Contacts....">
            </div>
            <ul class="contact-list">
                <li class="contact active">
                    <img src="images/profile.png" alt="User">
                    <div class="contact-info">
                        <h4>Arpan</h4>
                        <p>Hey there!</p>
                    </div>
                </li>
                <li class="contact">
                    <img src="images/profile.png" alt="User">
                    <div class="contact-info">
                        <h4>Rahul</h4>
                        <p>What's up?</p>
                    </div>
                    <div class="message-count">3</div>
                </li>
                <li class="contact">
                    <img src="images/profile.png" alt="User">
                    <div class="contact-info">
                        <h4>Priya</h4>
                        <p>Let's catch up later!</p>
                    </div>
                    <div class="message-count">7</div>
                </li>
            </ul>
        </div>
        <div class="chat-right">
            <div class="chat-header">
                <div class="chat-user-info">
                    <img src="images/profile.png" alt="User">
                    <h3>Arpan</h3>
                </div>
                <div class="chat-actions">
                    <img src="images/icons8-video-call-50.png" alt="Video Call" class="icon">
                    <img src="images/phone.png" alt="Audio Call" class="icon">
                    <img src="images/search.png" alt="Search" class="icon">
                    <img src="images/more.png" alt="Menu" class="icon">
                </div>
            </div>
            <div class="chat-messages">
                <div class="message received">How are you?</div>
                <div class="message sent">I am good</div>
            </div>
            <div class="chat-input">
                <input type="text" placeholder="Type a message....">
                <button>Send</button>
            </div>
        </div>
    </main>
    <footer class="main-footer">
        <p>&copy; 2025 Chat Connect. All rights reserved</p>
    </footer>
</body>
</html>
